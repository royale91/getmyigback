<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Account Recovered</title>
<style>
  :root{
    --ink:#f2f3f5;--paper:#0f1014;--surface:#16181d;--surface2:#1e2128;--panel:#0a0b0e;
    --muted:#9296a0;--line:#262a31;--green:#e1306c;--green-d:#c1275c;--orange:#fa7e1e;
    --ig-grad:linear-gradient(95deg,#feda75 0%,#fa7e1e 22%,#e1306c 52%,#962fbf 78%,#4f5bd5 100%);
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--green)}
  .topbar{background:var(--panel);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
  .glyph{width:24px;height:24px;border:2px solid #fff;border-radius:7px;display:inline-grid;place-items:center;position:relative}
  .glyph::before{content:"";width:10px;height:10px;border:2px solid #fff;border-radius:50%}
  .glyph::after{content:"";position:absolute;top:3px;right:3px;width:3px;height:3px;background:#fff;border-radius:50%}
  .topbar .out{color:var(--muted);font-size:13px;text-decoration:none;cursor:pointer;background:none;border:none;font:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:28px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ig-grad);color:#fff;border:none;
    border-radius:100px;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;width:100%}
  .btn:hover{filter:brightness(1.07)}
  .warn{background:#2a1a12;border:1px solid #52351f;color:#f0b892;border-radius:10px;padding:14px 18px;font-size:13.5px;margin-bottom:22px}
  code{font-family:var(--mono);background:var(--surface2);padding:1px 6px;border-radius:4px}

  /* gate */
  .gate{max-width:400px;margin:70px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:38px;
    box-shadow:0 30px 70px -40px rgba(0,0,0,.6)}
  .gate h1{font-size:24px;letter-spacing:-.02em;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:22px}
  .gate input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;font-size:15px;
    margin-bottom:12px;background:var(--surface2);color:var(--ink)}
  .gate input:focus{outline:none;border-color:var(--green)}
  .gate .err{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:16px}

  /* dashboard */
  #dash{display:none}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .stats{display:flex;gap:14px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px}
  .stat b{display:block;font-size:26px;letter-spacing:-.03em}
  .stat span{color:var(--muted);font-size:12px}
  .refresh{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:100px;padding:10px 18px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}

  .case{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  .case .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .case .head h3{font-size:18px;letter-spacing:-.01em}
  .case .head .when{color:var(--muted);font-size:12px;margin-left:auto}
  .pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.02em}
  .pill.unpaid{background:#3a2015;color:#f0a878}
  .pill.paid{background:#15321f;color:#7fe0a8}
  .contact{color:var(--muted);font-size:13px;margin-bottom:14px}
  .contact a{color:var(--green)}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 20px;margin:10px 0 16px}
  .kv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
  .kv .v{font-size:14px;color:#dfe3e8;white-space:pre-wrap;word-break:break-word}
  .kv .item.wide{grid-column:1/-1}
  .photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .photos a{display:block}
  .photos img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
  .photos .file{display:flex;align-items:center;justify-content:center;width:92px;height:92px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:11px;color:var(--muted);text-align:center;padding:6px;text-decoration:none}
  .actions{margin-top:14px;display:flex;gap:10px}
  .mini{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:100px;padding:8px 16px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .mini.paid{border-color:var(--green)}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
  h2.sec{font-size:16px;margin:6px 0 14px;letter-spacing:-.01em}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="glyph"></span> Account Recovered — Admin</div>
  <div>
    <a href="/" class="out" style="margin-right:16px">← Site</a>
    <button class="out" id="logoutBtn" style="display:none" onclick="logout()">Log out</button>
  </div>
</div>

<!-- LOGIN GATE (Supabase Auth) -->
<div id="gate" class="wrap">
  <div class="gate">
    <h1>Owner login</h1>
    <p>Sign in to view case submissions.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Log in</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="wrap">
  <div id="notconfigured" class="warn" style="display:none">
    ⚠ Backend not configured yet. Add your Supabase URL + anon key to <code>config.js</code> and redeploy, then this dashboard goes live.
  </div>
  <div class="bar">
    <div class="stats">
      <div class="stat"><b id="s-total">0</b><span>Total cases</span></div>
      <div class="stat"><b id="s-unpaid">0</b><span>Awaiting payment</span></div>
      <div class="stat"><b id="s-paid">0</b><span>Paid</span></div>
    </div>
    <button class="refresh" onclick="loadCases()">↻ Refresh</button>
  </div>
  <h2 class="sec">Case submissions</h2>
  <div id="cases"><div class="empty">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.SB_URL="https://nugwceeedfjszmnixgcw.supabase.co";window.SB_KEY="sb_publishable_9qBCcY7xx3LpTcUlVGWXWA_Fy9pw0Iw";</script>
<script>
  var sb = (window.supabase && window.SB_URL && String(window.SB_URL).indexOf('http')===0)
    ? window.supabase.createClient(window.SB_URL, window.SB_KEY) : null;

  var LABELS = {
    full_name:'Name', citystatezip:'City, State, ZIP', account_meaning:'What the account was to them',
    others_disabled:'Other accounts disabled?', others_list:'Other handles', date_down:'Date disabled',
    screen_text:'Screen wording', can_login:'Can still log in?', mentions_deletion:'Deletion / deadline?',
    case_id:'Support case ID', case_date:'Case opened', reps_count:'# of reps', asked_policy:'Asked what they violated?',
    policy_answer:'What they said', denied:'Formally denied?', denied_date:'Denial date', denied_wording:'Denial wording',
    tried:'Already tried', tried_detail:'What happened', income_amount:'Income', income_per:'Per',
    proof:'Proof available', who_else:'Who else it affects', share_link:'Share link', scrolled_back:'Scrolled chats to start?',
    might_look_bad:'Anything that looks bad', account_age:'Account age', account_status:'Status',
    ack1:'Ack: doc prep not legal advice', ack2:'Ack: no guarantee', ack3:'Ack: files/mails themselves', ack4:'Ack: info accurate'
  };
  var WIDE = {account_meaning:1, policy_answer:1, tried_detail:1, who_else:1, might_look_bad:1, screen_text:1, denied_wording:1};

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function humanize(k){return LABELS[k]||k.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});}

  async function login(){
    document.getElementById('err').textContent='';
    if(!sb){document.getElementById('err').textContent='Backend not configured (config.js).';return;}
    var email=document.getElementById('email').value.trim();
    var pw=document.getElementById('pw').value;
    var r=await sb.auth.signInWithPassword({email:email,password:pw});
    if(r.error){document.getElementById('err').textContent=r.error.message;return;}
    showDash();
  }
  async function logout(){ if(sb) await sb.auth.signOut(); location.reload(); }

  function showDash(){
    document.getElementById('gate').style.display='none';
    document.getElementById('dash').style.display='block';
    document.getElementById('logoutBtn').style.display='inline';
    if(!sb) document.getElementById('notconfigured').style.display='block';
    loadCases();
  }

  async function signedUrl(path){
    try{ var r=await sb.storage.from('case-files').createSignedUrl(path,3600); return r.data?r.data.signedUrl:null; }
    catch(e){ return null; }
  }
  function isImg(p){ return /\.(png|jpe?g|gif|webp|heic|heif)$/i.test(p); }

  async function loadCases(){
    if(!sb) return;
    var box=document.getElementById('cases');
    box.innerHTML='<div class="empty">Loading…</div>';
    var r=await sb.from('cases').select('*').order('created_at',{ascending:false});
    if(r.error){ box.innerHTML='<div class="empty">Error: '+esc(r.error.message)+'</div>'; return; }
    var rows=r.data||[];
    document.getElementById('s-total').textContent=rows.length;
    document.getElementById('s-unpaid').textContent=rows.filter(function(x){return x.status!=='paid';}).length;
    document.getElementById('s-paid').textContent=rows.filter(function(x){return x.status==='paid';}).length;
    if(!rows.length){ box.innerHTML='<div class="empty">No submissions yet. They\'ll appear here the moment someone completes the Hands-Free questionnaire.</div>'; return; }

    box.innerHTML='';
    for(var i=0;i<rows.length;i++){
      var c=rows[i]; var d=c.data||{};
      var when=c.created_at?new Date(c.created_at).toLocaleString():'';
      var kv='';
      Object.keys(d).forEach(function(k){
        var v=d[k]; if(v==null||v==='') return;
        if(Array.isArray(v)) v=v.join(', ');
        kv+='<div class="item'+(WIDE[k]?' wide':'')+'"><div class="k">'+esc(humanize(k))+'</div><div class="v">'+esc(v)+'</div></div>';
      });
      var el=document.createElement('div');
      el.className='case';
      el.innerHTML=
        '<div class="head"><h3>'+esc(c.name||d.full_name||'(no name)')+'</h3>'+
        '<span class="pill '+(c.status==='paid'?'paid':'unpaid')+'">'+(c.status==='paid'?'Paid':'Awaiting payment')+'</span>'+
        '<span class="when">'+esc(when)+'</span></div>'+
        '<div class="contact">'+esc(d.handle||c.handle||'')+' · <a href="mailto:'+esc(c.email||'')+'">'+esc(c.email||'')+'</a> · '+esc(c.phone||'')+'</div>'+
        '<div class="kv">'+kv+'</div>'+
        '<div class="k" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700">Photos &amp; documents</div>'+
        '<div class="photos" id="ph-'+i+'"><span style="color:var(--muted);font-size:13px">Loading files…</span></div>'+
        '<div class="actions">'+(c.status==='paid'?'':'<button class="mini paid" onclick="markPaid(\''+c.id+'\')">Mark as paid</button>')+'</div>';
      box.appendChild(el);

      (function(caseObj,idx){
        var files=caseObj.files||[];
        var ph=document.getElementById('ph-'+idx);
        if(!files.length){ ph.innerHTML='<span style="color:var(--muted);font-size:13px">No files uploaded.</span>'; return; }
        Promise.all(files.map(function(p){return signedUrl(p).then(function(u){return {p:p,u:u};});})).then(function(list){
          ph.innerHTML='';
          list.forEach(function(o){
            if(!o.u){ ph.innerHTML+='<span class="file">'+esc(o.p)+'</span>'; return; }
            if(isImg(o.p)) ph.innerHTML+='<a href="'+o.u+'" target="_blank" rel="noopener"><img src="'+o.u+'" loading="lazy"></a>';
            else ph.innerHTML+='<a class="file" href="'+o.u+'" target="_blank" rel="noopener">'+esc(o.p.split('-').slice(2).join('-'))+'</a>';
          });
        });
      })(c,i);
    }
  }

  async function markPaid(id){
    if(!sb) return;
    await sb.from('cases').update({status:'paid'}).eq('id',id);
    loadCases();
  }

  // auto-resume session
  (async function(){
    if(!sb){ document.getElementById('err').textContent='Backend not configured yet — add keys to config.js.'; return; }
    var s=await sb.auth.getSession();
    if(s.data && s.data.session) showDash();
  })();
</script>
</body>
</html>
